<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Academic Outreach Studio{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/studio.css">
  <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">Academic Outreach <span>Studio</span></a>
    <nav class="nav" aria-label="Primary">
      <a href="/dashboard" {% if nav=='dashboard' %}aria-current="page"{% endif %}>Campaign</a>
      <a href="/profile" {% if nav=='profile' %}aria-current="page"{% endif %}>Profile</a>
      <a href="/directory" {% if nav=='directory' %}aria-current="page"{% endif %}>Directory</a>
      <a href="/shortlist" {% if nav=='shortlist' %}aria-current="page"{% endif %}>Shortlist</a>
      <a href="/drafts" {% if nav=='drafts' %}aria-current="page"{% endif %}>Drafts</a>
      <a href="/tracker" {% if nav=='tracker' %}aria-current="page"{% endif %}>Tracker</a>
      <details class="nav-more">
        <summary>More</summary>
        <div class="nav-more-panel">
          <a href="/compare" {% if nav=='compare' %}aria-current="page"{% endif %}>Compare</a>
          <a href="/ai" {% if nav=='ai' %}aria-current="page"{% endif %}>AI</a>
          <a href="/mail" {% if nav=='mail' %}aria-current="page"{% endif %}>Mail</a>
          <a href="/connections" {% if nav=='connections' %}aria-current="page"{% endif %}>Connections</a>
          <a href="/start" {% if nav=='start' %}aria-current="page"{% endif %}>Openings</a>
          <a href="/planner" {% if nav=='planner' %}aria-current="page"{% endif %}>Planner</a>
          <a href="/backup" {% if nav=='backup' %}aria-current="page"{% endif %}>Backup</a>
          <a href="/reader" {% if nav=='reader' %}aria-current="page"{% endif %}>Data Reader</a>
          <a href="/offer" {% if nav=='offer' %}aria-current="page"{% endif %}>Products</a>
          <a href="/return" {% if nav=='return' %}aria-current="page"{% endif %}>Return later</a>
        </div>
      </details>
    </nav>
  </header>
  <main>
    {% if flash %}
      <div class="flash {% if flash_error %}error{% endif %}" role="status">{{ flash }}</div>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
